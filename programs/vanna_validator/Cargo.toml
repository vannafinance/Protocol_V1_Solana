[package]
name = "vanna_validator"
version = "0.1.0"
description = "Vanna's validator: which external calls a margin may make (Kamino, Jupiter, GMTrade)"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "vanna_validator"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "vanna_credit_layer/idl-build", "vanna_oracle/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
vanna_credit_layer = { path = "../vanna_credit_layer", features = ["no-entrypoint"] }
vanna_oracle = { path = "../vanna_oracle", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
